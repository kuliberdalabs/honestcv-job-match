[project]
name = "honestcv"
version = "0.1.0"
description = "Job offers and CV matching with a claims ledger that keeps tailored CVs truthful. Reads public job APIs and your own files. Read-only, no auto-apply."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kuliberda Labs" }]
keywords = ["job-search", "cv", "resume", "job-matching", "claims-ledger", "python-cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.27",
    "pydantic>=2",
    "httpx",
    "PyYAML",
    "pypdf",
]

[project.urls]
Homepage = "https://github.com/kuliberdalabs/honestcv-job-match"
Repository = "https://github.com/kuliberdalabs/honestcv-job-match"
Issues = "https://github.com/kuliberdalabs/honestcv-job-match/issues"
Changelog = "https://github.com/kuliberdalabs/honestcv-job-match/blob/main/CHANGELOG.md"

[project.scripts]
honestcv = "honestcv.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honestcv"]
# Sample and data files are always packaged, even where a .gitignore pattern
# (ledger.yml, honestcv.yml, cvs/, offers/, evidence/) would otherwise drop them.
artifacts = [
    "src/honestcv/samples/**",
    "src/honestcv/data/**",
    "src/honestcv/sources/registry.yml",
    "src/honestcv/report/template.html",
]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "*.md", "LICENSE"]
artifacts = [
    "tests/golden/**",
    "src/honestcv/samples/**",
    "src/honestcv/data/**",
    "src/honestcv/sources/registry.yml",
    "src/honestcv/report/template.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
