<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>$title</title>
<style>
:root {
  --bg: #f6f6f2; --fg: #1d1d1b; --muted: #55554f; --card: #ffffff; --line: #d9d9cf; --track: #e4e4da; --chip: #ecece3;
  --accent: #2c5f8d; --ok: #1b6e3f; --warn: #85560a; --bad: #a8261d; --tint-warn: #fbf1dc; --tint-bad: #fbe4e1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --fg: #ececE5; --muted: #a8a89f; --card: #1d1d1b; --line: #34342f; --track: #2e2e2a; --chip: #2a2a27;
    --accent: #7db4e6; --ok: #6fcf97; --warn: #e6b450; --bad: #ff8f86; --tint-warn: #2d2615; --tint-bad: #321b19;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.5rem; margin: 8px 0 4px; }
h2 { font-size: 1.15rem; margin: 28px 0 8px; }
h3 { font-size: 1.05rem; margin: 0; overflow-wrap: anywhere; }
a { color: var(--accent); overflow-wrap: anywhere; }
code { background: var(--chip); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }
.sub { color: var(--muted); margin: 0 0 12px; }
.status, .chip { display: inline-block; font-size: 0.8rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); }
.s-pass { color: var(--ok); border-color: var(--ok); }
.s-partial { color: var(--warn); border-color: var(--warn); }
.s-fail { color: var(--bad); border-color: var(--bad); }
.chip.new { color: var(--accent); border-color: var(--accent); }
.note { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--card); margin: 12px 0; }
.banner { border-radius: 8px; padding: 8px 12px; margin: 12px 0; border: 1px solid var(--warn); background: var(--tint-warn); }
.banner.fail { border-color: var(--bad); background: var(--tint-bad); }
.banner p, .banner ul { margin: 4px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 12px 0; }
.top { display: flex; gap: 12px; align-items: flex-start; }
.pct { text-align: center; min-width: 64px; }
.pct b { display: block; font-size: 1.9rem; line-height: 1.1; }
.pct small { color: var(--muted); font-size: 0.75rem; }
.b-strong b { color: var(--ok); }
.b-good b { color: var(--accent); }
.b-fair b { color: var(--warn); }
.rank { color: var(--muted); margin-right: 4px; }
.meta, .links, .cv { margin: 4px 0; color: var(--muted); font-size: 0.92rem; overflow-wrap: anywhere; }
.chips { margin: 6px 0 0; }
details { margin: 8px 0; }
summary { cursor: pointer; font-weight: 600; }
.crit { margin: 10px 0; }
.crit .row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.crit em { font-style: normal; font-weight: 400; color: var(--muted); }
.crit.na { color: var(--muted); }
.bar { height: 8px; background: var(--track); border-radius: 4px; margin: 4px 0; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.why { margin: 2px 0; overflow-wrap: anywhere; }
blockquote { margin: 2px 0 2px 4px; padding-left: 8px; border-left: 3px solid var(--line); color: var(--muted); font-size: 0.92rem; overflow-wrap: anywhere; }
.small { color: var(--muted); font-size: 0.85rem; }
dl { margin: 8px 0; }
dt { font-weight: 600; margin-top: 6px; }
dd { margin: 0; overflow-wrap: anywhere; }
ul { padding-left: 20px; }
li { margin: 4px 0; overflow-wrap: anywhere; }
footer { color: var(--muted); font-size: 0.85rem; margin: 32px 0 16px; }
</style>
</head>
<body>
<main>
<header>
<h1>$title</h1>
<p class="sub"><span class="status $status_class">$status</span> $summary</p>
$banner
<div class="note">$fixed</div>
</header>
$body
<footer>$footer</footer>
</main>
</body>
</html>
