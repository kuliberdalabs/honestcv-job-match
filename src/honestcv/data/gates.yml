# honestcv gate phrases, English and Polish. Written by hand for honestcv.
# An offer whose title or text holds one of these phrases is filtered out and listed with the phrase as the reason.
# A phrase is ignored when "not", "no", "without", "nie" or "bez" stands within 20 characters before it.
# Tokens use the syntax of textutil.hit().

