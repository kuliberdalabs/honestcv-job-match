# Words that make a requirement optional. The soft window starts at one of these and ends at the end of the
# sentence, the line, or the next requirements heading, whichever comes first.
soft_words: [nice to have, nice-to-have, good to have, a plus, big plus, bonus, preferred, optional, desirable,
  an advantage, advantageous, mile widziane, mile widziana, mile widziany, dodatkowym atutem, dodatkowy atut,
  atut, atutem, będzie plusem, plusem]

# A missing must-have near one of these words costs the hard_requirement_missing penalty.
hard_words: [must have, must-have, required, expert, advanced, mandatory, wymagane, wymagana, wymagany,
  niezbędne, niezbędna, niezbędny, obowiązkowo]

# A skill mention is ignored when one of these stands right before it in the same sentence (within 40 characters),
# or one of the "after" phrases follows it ("Python is not required").
negations_before: ["no", without, bez, not required, nie wymagamy, no need for, no prior]
negations_after: [not required, not needed, not necessary, is optional, nie jest wymagany, nie jest wymagana,
  nie jest wymagane, nie wymagamy, nie wymagane]

# A CV line that starts with one of these labels and a colon is a skills line.
skill_labels: [skills, technical skills, key skills, core skills, tech stack, technologies, tools, tooling,
  umiejętności, umiejętności techniczne, kompetencje, technologie, narzędzia]

# CV section headings. A heading line (a markdown # line, or a short line that is only this text) opens a section.
cv_headings:
  experience: [experience, work experience, professional experience, employment, employment history, work history,
    career history, doświadczenie, doświadczenie zawodowe, historia zatrudnienia, przebieg kariery, praca zawodowa]
  education: [education, courses, certifications, certificates, training, wykształcenie, edukacja, kursy,
    certyfikaty, szkolenia]
  skills: [skills, technical skills, key skills, core skills, tools, tech stack, technologies, umiejętności,
    kompetencje, narzędzia, technologie]
  languages: [languages, language skills, języki, języki obce, znajomość języków]
  other: [profile, summary, about me, objective, projects, interests, hobbies, references, contact, publications,
    volunteering, awards, o mnie, podsumowanie, projekty, zainteresowania, kontakt, dane kontaktowe, publikacje]
