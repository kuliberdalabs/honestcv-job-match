# honestcv skills list and reading cues, English and Polish.
# Origin: written by hand for honestcv. Nothing here comes from a job board's taxonomy or from a third-party list.
#
# skills:   canonical name, aliases, and an optional ambiguous flag. Aliases use the token syntax of textutil.hit():
#           a bare token is a whole word or phrase, "python*" is a prefix at a word start.
#           ambiguous: true marks a name that is also an everyday word (go, make, rest, excel ...). In free text such a
#           skill counts only through its aliases ("golang", "make.com"). In a CV skills line the name counts too.
#           There is no bare "analytics" entry: it is a field, not a skill.
# Quote words that YAML reads as booleans ("no", "on", "yes").

