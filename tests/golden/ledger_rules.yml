# Fictional sample. Any resemblance to real people or companies is accidental.
# Golden rule-coverage ledger for Sam Example (fictional): e-commerce catalogue work.
# Path refs resolve against tests/golden/ (pass ws_root=tests/golden). Lints with zero ERRORs and exactly two
# WARNs on 2026-10-10: the passed review_by of catalogue-years, and the draft claim photo-schedule.
schema_version: 1
person:
  name: Sam Example               # fictional
  as_of: 2026-09-01
  stale_after_days: 365

claims:
  - id: product-descriptions
    kind: output
    summary: Product descriptions generated by a template tool
    confirmed:
      generated: [{type: file_list, ref: evidence/rules/descriptions-file-list.txt, date: 2025-03-14}]
    quantities:
      - {name: descriptions_generated, value: 300, unit: description, state: generated}
    visibility: never
    review_by: 2027-03-01

  - id: feed-integration
    kind: delivery
    summary: Supplier feed integration that an outside contractor built to my specification
    confirmed:
      built:   [{type: url,             ref: "https://files.example.invalid/feed-specification-v2", date: 2024-09-02}]
      shipped: [{type: handover_record, ref: evidence/rules/feed-handover.txt,          date: 2024-11-18}]
    authorship: {role: directed, agent_assisted: false, can_defend_end_to_end: true}
    private_names: [Supplier Example Ltd]
    forbidden_here:
      - '(?i)\bon my own\b'
    allowed:
      - "Specified the supplier feed integration that an outside contractor delivered."
    review_by: 2027-03-01

  - id: photo-schedule
    kind: delivery
    summary: Planned the photo-shoot schedule for new catalogue items.
    allowed:
      - "Planned the photo-shoot schedule for new catalogue items."
    draft: true
    draft_source: "cvs/sam-example.md#line 9"

  - id: catalogue-years
    kind: biography
    statement: "Catalogue assistant, 2021-2026"
    facts: {start_year: 2021, end_year: 2026, precision: year}
    allowed:
      - "Catalogue assistant at an online shop, 2021-2026."
    review_by: 2026-06-01             # passed on 2026-10-10: lines matched to this claim get STALE
